apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Replace with your actual image name after building
        image: backend:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DB_CONNECTION
          value: "pgsql"
        - name: DB_HOST
          value: "host.minikube.internal"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "clidb"
        - name: DB_USERNAME
          value: "postgres"
        - name: DB_PASSWORD
          value: "Password123"     
        - name: APP_ENV
          value: "local"
        - name: APP_DEBUG
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: LoadBalancer

