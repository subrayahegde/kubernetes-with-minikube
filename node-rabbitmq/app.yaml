apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: app-web:latest
        imagePullPolicy: Never 
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: RABBITMQ_URL
          value: amqp://admin:supersecret@rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: app-worker:latest
        imagePullPolicy: Never 
        env:
        - name: NODE_ENV
          value: development
        - name: RABBITMQ_URL
          value: amqp://admin:supersecret@rabbitmq:5672

