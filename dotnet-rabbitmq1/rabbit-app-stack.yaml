# ==========================================
# 1. RABBITMQ BROKER (DEPLOYMENT & SERVICE)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672

---
# ==========================================
# 2. PRODUCER API (DEPLOYMENT & SERVICE)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer-app
  template:
    metadata:
      labels:
        app: producer-app
    spec:
      containers:
      - name: producer
        image: producer:latest
        imagePullPolicy: Never # Forces Kubernetes to seek your local Minikube Docker images
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: producer-service
spec:
  type: NodePort
  selector:
    app: producer-app
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080

---
# ==========================================
# 3. CONSUMER BACKGROUND WORKER (DEPLOYMENT)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-app
  template:
    metadata:
      labels:
        app: consumer-app
    spec:
      containers:
      - name: consumer
        image: consumer:latest
        imagePullPolicy: Never # Forces Kubernetes to seek your local Minikube Docker images

