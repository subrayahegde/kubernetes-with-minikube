apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Notice 'mysql' and 'rabbitmq' match the Kubernetes internal Service names below
  ConnectionStrings__DefaultConnection: "Server=mysql-service;Database=orderservice;User Id=root;Password=Password123#;"
---
# 1. RabbitMQ Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
# 2. MySQL Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "Password123#"
        - name: MYSQL_DATABASE
          value: "orderservice"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# 3. OrderService App Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        # Added the mandatory network checking script below:
        command: ['sh', '-c', 'until nc -zvw1 rabbitmq-service 5672; do echo "waiting for rabbitmq..."; sleep 2; done;']
    
      containers:
      - name: orderservice
        image: orderservice:latest
        imagePullPolicy: Never # Forces Kubernetes to use the local image you built
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice-service
spec:
  type: NodePort # Exposes the API endpoint outside Minikube
  selector:
    app: orderservice
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080



